name: PiNVR tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Test native API and initial credentials
        run: PYTHONPATH=. pytest -q tests/test_app.py tests/test_talk.py tests/test_rtsp.py tests/test_notifications.py tests/test_reliability.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
