name: Refresh PiNVR feature screenshots
on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'tests/theme_screenshots.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
concurrency:
  group: pinvr-screenshots-main
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium screenshot tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Render themes and feature screenshots
        run: python tests/theme_screenshots.py
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep newly rendered files in the working directory while moving
          # onto the latest main branch. Never rebase binary screenshot commits.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add screenshots/
            if git diff --cached --quiet; then
              echo "Screenshots already current"
              exit 0
            fi
            git commit -m "docs: refresh PiNVR screenshots from current interface"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main changed during upload; retrying on latest"
            sleep 2
          done
          echo "Unable to publish screenshots after retries"
          exit 1
      - name: Run verification on final main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A screenshot commit made with GITHUB_TOKEN does not normally
          # trigger push workflows. Dispatch the test suite explicitly so
          # the final HEAD receives its own verification check.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/dispatches" -f ref=main
          echo "Verification dispatched for the latest main commit"
