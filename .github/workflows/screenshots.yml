name: Refresh PiNVR feature screenshots
on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'tests/theme_screenshots.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium screenshot tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Render themes and feature screenshots
        run: python tests/theme_screenshots.py
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/theme-* screenshots/alerts-notifications-settings.png screenshots/rtsp-connection-test.png
          if git diff --cached --quiet; then
            echo "Screenshots already current"
          else
            git commit -m "docs: refresh PiNVR theme, alerts and RTSP screenshots"
            git push origin HEAD:main
          fi
